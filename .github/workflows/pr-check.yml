name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - master
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
      package: ${{ steps.plan.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Plan required checks
        id: plan
        env:
          PR_BASE: ${{ github.base_ref }}
        run: cargo run --locked --quiet -p xtask -- plan-pr-checks --base-ref "origin/$PR_BASE" --target-branch "$PR_BASE"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check repository hygiene
        run: ./scripts/check-text-files.sh

      - name: Check repository governance
        env:
          PR_BASE: ${{ github.base_ref }}
        run: cargo run --locked --quiet -p xtask -- check-repository-governance --base-ref "origin/$PR_BASE"

      - name: Check document size advisory
        run: bash scripts/check-doc-size.sh --include-advisory

  rust-baseline:
    needs: repo-hygiene
    if: needs.repo-hygiene.outputs.rust == 'true'
    name: Rust Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rust baseline
        run: cargo run --locked --quiet -p xtask -- validate-workspace --skip-format

  rust-baseline-macos:
    needs: repo-hygiene
    if: needs.repo-hygiene.outputs.rust == 'true'
    name: Rust Baseline (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rust baseline
        run: cargo run --locked --quiet -p xtask -- validate-workspace --skip-format

  rust-baseline-windows:
    needs: repo-hygiene
    if: needs.repo-hygiene.outputs.rust == 'true'
    name: Rust Baseline (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rust baseline
        shell: pwsh
        run: cargo run --locked --quiet -p xtask -- validate-workspace --skip-format

  dotnet-adapter-baseline:
    needs: repo-hygiene
    if: needs.repo-hygiene.outputs.dotnet == 'true'
    name: .NET Adapter Baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run .NET CAPE-OPEN baseline
        shell: pwsh
        run: ./scripts/check-dotnet-capeopen.ps1

  windows-staging-package:
    name: Windows Staging Package
    runs-on: windows-latest
    needs: repo-hygiene
    if: needs.repo-hygiene.outputs.package == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows staging package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -Clean

      - name: Upload Windows staging package
        uses: actions/upload-artifact@v4
        with:
          name: radishflow-windows-staging-package
          path: artifacts/packages/RadishFlow-*.zip
          if-no-files-found: error

  candidate-quality:
    name: Candidate Quality
    runs-on: ubuntu-latest
    if: always()
    needs:
      - repo-hygiene
      - rust-baseline
      - rust-baseline-macos
      - rust-baseline-windows
      - dotnet-adapter-baseline
      - windows-staging-package
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Summarize PR quality gate
        env:
          RADISHFLOW_CI_NEEDS: ${{ toJSON(needs) }}
        run: cargo run --locked --quiet -p xtask -- check-pr-results
