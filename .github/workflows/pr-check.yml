name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - master
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check repository hygiene
        run: ./scripts/check-text-files.sh

      - name: Check document size advisory
        run: bash scripts/check-doc-size.sh --include-advisory

  rust-baseline:
    name: Rust Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rust baseline
        run: ./scripts/check-repo.sh --skip-text-files

  rust-baseline-macos:
    name: Rust Baseline (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rust baseline
        run: ./scripts/check-repo.sh --skip-text-files

  rust-baseline-windows:
    name: Rust Baseline (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run rust baseline
        shell: pwsh
        run: ./scripts/check-repo.ps1 -SkipTextFiles

  dotnet-adapter-baseline:
    name: .NET Adapter Baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run .NET CAPE-OPEN baseline
        shell: pwsh
        run: ./scripts/check-dotnet-capeopen.ps1

  windows-staging-package:
    name: Windows Staging Package
    runs-on: windows-latest
    needs:
      - repo-hygiene
      - rust-baseline
      - rust-baseline-macos
      - rust-baseline-windows
      - dotnet-adapter-baseline

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows staging package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -Clean

      - name: Upload Windows staging package
        uses: actions/upload-artifact@v4
        with:
          name: radishflow-windows-staging-package
          path: artifacts/packages/RadishFlow-*.zip
          if-no-files-found: error

  candidate-quality:
    name: Candidate Quality
    runs-on: ubuntu-latest
    if: always()
    needs:
      - repo-hygiene
      - rust-baseline
      - rust-baseline-macos
      - rust-baseline-windows
      - dotnet-adapter-baseline
      - windows-staging-package
    steps:
      - name: Summarize PR quality gate
        shell: bash
        env:
          REPO_HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
          RUST_BASELINE_RESULT: ${{ needs.rust-baseline.result }}
          RUST_BASELINE_MACOS_RESULT: ${{ needs.rust-baseline-macos.result }}
          RUST_BASELINE_WINDOWS_RESULT: ${{ needs.rust-baseline-windows.result }}
          DOTNET_ADAPTER_BASELINE_RESULT: ${{ needs.dotnet-adapter-baseline.result }}
          WINDOWS_STAGING_PACKAGE_RESULT: ${{ needs.windows-staging-package.result }}
        run: |
          failed=false
          {
            echo "## PR Quality Gate"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          append_result() {
            local check_name="$1"
            local check_result="$2"
            echo "| ${check_name} | ${check_result} |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${check_result}" != "success" ]]; then
              failed=true
            fi
          }

          append_result "Repo Hygiene" "${REPO_HYGIENE_RESULT}"
          append_result "Rust Baseline" "${RUST_BASELINE_RESULT}"
          append_result "Rust Baseline (macOS)" "${RUST_BASELINE_MACOS_RESULT}"
          append_result "Rust Baseline (Windows)" "${RUST_BASELINE_WINDOWS_RESULT}"
          append_result ".NET Adapter Baseline" "${DOTNET_ADAPTER_BASELINE_RESULT}"
          append_result "Windows Staging Package" "${WINDOWS_STAGING_PACKAGE_RESULT}"

          if [[ "${failed}" == "true" ]]; then
            echo "One or more PR quality components did not succeed." >&2
            exit 1
          fi

          echo "All PR quality components succeeded."
