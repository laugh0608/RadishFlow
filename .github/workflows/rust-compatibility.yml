name: Rust Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-stable:
    name: Rust Stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Override rust-toolchain.toml for this compatibility check and its children.
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Show compatibility toolchain
        run: rustc --version --verbose

      - name: Run Rust compatibility baseline
        if: runner.os != 'Windows'
        run: ./scripts/check-repo.sh

      - name: Run Rust compatibility baseline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-repo.ps1
