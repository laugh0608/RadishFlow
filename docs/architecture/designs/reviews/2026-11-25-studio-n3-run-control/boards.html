<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio · N3 运行控制评审</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script defer src="boards.js"></script>
</head>
<body>
  <aside aria-label="Review">
    <strong id="review"></strong>
    <label><span id="caseLabel"></span><select id="scenario"></select></label>
    <label><span id="languageLabel"></span><select id="language">
      <option value="zh">简体中文</option><option value="en">English</option>
    </select></label>
    <label><span id="sizeLabel"></span><select id="size">
      <option value="14">14 px</option><option value="20">20 px</option>
    </select></label>
    <button id="advance"></button>
    <button id="edit"></button>
    <button id="reset"></button>
  </aside>
  <main>
    <header><strong>RadishFlow Studio</strong><span id="project"></span></header>
    <section aria-labelledby="runTitle">
      <h1 id="runTitle"></h1>
      <div class="line"><span id="method"></span><span id="inputs"></span></div>
      <div class="actions"><button id="run"></button><button id="startPaused"></button></div>
    </section>
    <section aria-labelledby="activityTitle">
      <h2 id="activityTitle"></h2>
      <div class="status" id="status" role="status" tabindex="-1"></div>
      <p id="position"></p>
      <div class="actions"><button id="pause"></button><button id="step"></button><button id="resume"></button><button id="cancel"></button></div>
    </section>
    <section aria-labelledby="resultTitle">
      <h2 id="resultTitle"></h2>
      <div id="source"></div>
      <p id="outlet"></p>
    </section>
  </main>
</body>
</html>
