<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H3 Studio · 只读复核评审</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script defer src="evidence.js"></script>
  <script defer src="boards.js"></script>
</head>
<body>
  <aside id="review-controls" class="review-controls" aria-label="画板评审">
    <strong id="review-label">H3 局部画板 · 待确认</strong>
    <label><span id="scene-label">场景</span><select id="scene"></select></label>
    <label><span id="language-label">语言</span>
      <select id="language"><option value="zh">简体中文</option><option value="en">English</option></select>
    </label>
    <label><span id="size-label">基准字号</span>
      <select id="size"><option value="14">14 px</option><option value="20">20 px</option></select>
    </label>
  </aside>
  <header class="shell">
    <div class="shell-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">R</span>RadishFlow Studio</div>
      <button id="close-review" class="button secondary"></button>
    </div>
  </header>
  <main id="board" class="board"></main>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
